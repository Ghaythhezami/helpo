sonar.projectKey=helpo
sonar.projectName=Helpo
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,packages/shared/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.d.ts,**/prisma/migrations/**,apps/web/public/**
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.e2e-spec.ts,apps/api/src/main.ts,apps/api/api/**,apps/api/prisma/**,apps/web/src/app/**/layout.tsx,**/*.config.*

sonar.javascript.lcov.reportPaths=packages/shared/coverage/lcov.info,apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.typescript.tsconfigPaths=packages/shared/tsconfig.json,apps/api/tsconfig.json,apps/web/tsconfig.json
