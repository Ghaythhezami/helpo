name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpo
          POSTGRES_PASSWORD: helpo-ci-only
          POSTGRES_DB: helpo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://helpo:helpo-ci-only@localhost:5432/helpo?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      STUDENT_COOKIE_SECRET: ci-only-student-cookie-secret-32-characters
      AI_MODE: demo
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @helpo/shared
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: API end-to-end tests (real Postgres)
        run: npm run test:e2e -w @helpo/api
      - name: Dependency audit (high/critical in production deps, documented exceptions in scripts/audit.mjs)
        run: node scripts/audit.mjs
      - run: npm run build
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpo
          POSTGRES_PASSWORD: helpo-ci-only
          POSTGRES_DB: helpo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The stack script swaps the database name to nibras_e2e on this server.
      DATABASE_URL: postgresql://helpo:helpo-ci-only@localhost:5432/helpo?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w @helpo/shared
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e -w @helpo/web
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .e2e-stack/
          retention-days: 7
